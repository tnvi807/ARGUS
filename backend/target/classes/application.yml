spring:
  application:
    name: argus-gateway
  datasource:
    url: ${ARGUS_DB_URL:jdbc:postgresql://localhost:5432/argus}
    username: ${ARGUS_DB_USER:argus}
    password: ${ARGUS_DB_PASSWORD:argus}
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only verifies the mapping matches.
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${ARGUS_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

argus:
  security:
    # HS256 signing key. MUST be overridden via environment in any shared deployment.
    jwt-secret: ${ARGUS_JWT_SECRET:argus-dev-only-secret-change-me-0123456789abcdef}
    jwt-ttl-minutes: ${ARGUS_JWT_TTL_MINUTES:720}
    max-failed-attempts: 5
    lockout-minutes: 15
    # Bootstrap administrator (created on first start, never logged in clear-text afterwards)
    admin-username: ${ARGUS_ADMIN_USERNAME:admin}
    admin-password: ${ARGUS_ADMIN_PASSWORD:ChangeMe!Argus2026}
    analyst-password: ${ARGUS_ANALYST_PASSWORD:Analyst!Argus2026}
    viewer-password: ${ARGUS_VIEWER_PASSWORD:Viewer!Argus2026}
  cors:
    allowed-origins: ${ARGUS_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000}
  upload:
    dir: ${ARGUS_UPLOAD_DIR:./data/uploads}
    max-bytes: 5242880
    allowed-extensions: json,csv,txt,log,md,png,jpg,jpeg,pdf
  feed:
    max-events: 400
  sim:
    autopilot-enabled: ${ARGUS_AUTOPILOT:true}
    tick-ms: 2100
