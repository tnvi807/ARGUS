spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:argus;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate

argus:
  upload:
    dir: ${ARGUS_UPLOAD_DIR:./data/uploads}
